<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>All</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main><div class="wrap">
  <header>
    <div class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg></div>
    <h1>All</h1>
    <span class="sub">Pick a tool</span>
  </header>
  <section id="update" class="tool hidden">
    <div style="flex:1"><div class="pname" id="upTitle"></div><div class="pdesc" id="upDesc">Installs and restarts the app</div></div>
    <button id="upBtn" class="primary">Update</button>
  </section>
  <nav class="tools">
    <a class="tool" href="squeeze.html">
      <div class="thumb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg></div>
      <div><div class="pname">Squeeze</div><div class="pdesc">Compress videos to a smaller size</div></div>
    </a>
    <a class="tool" href="trim.html">
      <div class="thumb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg></div>
      <div><div class="pname">Trim &amp; GIF</div><div class="pdesc">Cut a clip or turn it into a GIF</div></div>
    </a>
    <a class="tool" href="zip.html">
      <div class="thumb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M11 3v2m0 2v2m0 2v2m-1 2h2v3h-2z"/></svg></div>
      <div><div class="pname">Compress files</div><div class="pdesc">Pack files and folders into a .zip</div></div>
    </a>
    <a class="tool" href="merge.html">
      <div class="thumb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="11" height="14" rx="2"/><path d="M10 7h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-2"/></svg></div>
      <div><div class="pname">Merge</div><div class="pdesc">Combine PDFs and images into one PDF</div></div>
    </a>
  </nav>
</div></main>
<script>
(async () => {
  const T = window.__TAURI__, $ = id => document.getElementById(id);
  let u;
  try { u = await T.updater.check(); } catch { return; } // offline, or a .deb/dev build
  if (!u) return;
  $('upTitle').textContent = `Update available: v${u.version}`;
  $('update').classList.remove('hidden');
  $('upBtn').onclick = async () => {
    $('upBtn').disabled = true; $('upBtn').textContent = 'Updating…';
    try { await u.downloadAndInstall(); await T.process.relaunch(); }
    catch (e) { $('upDesc').textContent = String(e); $('upBtn').disabled = false; $('upBtn').textContent = 'Retry'; }
  };
})();
</script>
</body>
</html>
