[package]
name = "all"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
serde_json = "1.0.154"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
